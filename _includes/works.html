{%- comment -%} Список всех практических работ для главной страницы. {%- endcomment -%}
<ol class="toc">
{%- for w in site.data.nav %}
  <li class="toc__item">
    <span class="toc__num">{{ w.work }}.</span>
    <span class="toc__title">{{ w.title }}</span>
    <span class="toc__dash" aria-hidden="true">—</span>
    <a class="toc__link" href="{{ w.pages[0].url }}">{{ w.pages[0].code }}</a>
  </li>
{%- endfor %}
</ol>
