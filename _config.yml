# ---------------------------------------------------------------
# Настройки сайта. После изменения этого файла GitHub пересоберёт
# сайт сам; при локальном просмотре перезапустите jekyll serve.
# ---------------------------------------------------------------

title: "Язык программирования Python"

# Боковая панель
brand_title: "PYTHON · 2026"
brand_sub: "Язык программирования Python<br>Профиль «Биоинформатика»"

# Главная страница
home:
  # картинка в кружке, например assets/img/avatar.png; пусто — значок emoji
  avatar: ""
  emoji: "🐍"
  title: "Язык программирования Python"
  subtitle: "Профиль «Биоинформатика» · СПбАУ РАН им. Ж. И. Алферова"
  intro: "Теория, разобранные примеры и задания к практическим занятиям. За семестр шаг за шагом собираем сквозной проект «Анализ биологических последовательностей»."
  # кнопки под описанием; icon: code, chat, mail, play, book или link
  links:
    - title: "Занятия"
      url: "#works"
      icon: book
    - title: "GitHub"
      url: "https://github.com/spbau-bioinf/spbau-bioinf.github.io"
      icon: code
    # - title: "Telegram"
    #   url: "https://t.me/..."
    #   icon: chat
  # ссылки в верхней строке
  topnav:
    - title: "Занятия"
      url: "#works"
    - title: "GitHub"
      url: "https://github.com/spbau-bioinf/spbau-bioinf.github.io"
  works_title: "Практические занятия"

# Подпись в конце страниц (отключается в странице: show_author: false)
author: "Подготовил: Ерофеев А.И."

# Подвал
footer:
  - "© 2026 СПбАУ РАН им. Ж. И. Алферова · Кафедра биоинформатики и математической биологии"
  - "Санкт-Петербург"

# Все страницы используют один шаблон
defaults:
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  # подсвечивать и блоки ```text (нужно для подписей блоков)
  guess_lang: true
  # не превращать прямые кавычки в «умные»
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
